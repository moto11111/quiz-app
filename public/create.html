<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ルーム作成</title>
  <link rel="stylesheet" href="create.css" />
</head>
<body>
  <div class="container">
    <h2>ルームを作成</h2>
    <form id="createForm">
      <label for="roomId">ルームID（任意）</label>
      <input type="text" id="roomId" placeholder="例: room123" required />

      <label for="password">パスワード（任意）</label>
      <input type="password" id="password" placeholder="任意のパスワード" />

      <button type="submit">作成</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/create.js"></script>
</body>
</html>
