<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ルーム作成</title>
</head>
<body>
  <h2>ルームを作成</h2>
  <button onclick="createRoom()">ルーム作成</button>

  <script>
    function createRoom() {
      const roomId = "room1"; // 仮固定ID
      sessionStorage.setItem("roomId", roomId);
      sessionStorage.setItem("isHost", "true");
      location.href = "/waiting";
    }
  </script>
</body>
</html>
