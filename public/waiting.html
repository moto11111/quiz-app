<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>待機画面</title>
  <link rel="stylesheet" href="wait.css" />
</head>
<body>
  <div class="container">
    <h1>待機中...</h1>
    <p id="room-id">ルームID: 不明</p>
    <p id="player-count">現在の参加人数: 1</p>
    <button id="start-button" style="display: none;">出題開始</button>
  </div>

  <script>
    const socket = new WebSocket("wss://" + window.location.host);
    const roomId = localStorage.getItem("roomId");
    const isHost = localStorage.getItem("isHost") === "true";

    document.getElementById("room-id").textContent = "ルームID: " + roomId;

    socket.addEventListener("open", () => {
      socket.send(JSON.stringify({ type: "join-room", roomId }));
    });

    socket.addEventListener("message", (event) => {
      const msg = JSON.parse(event.data);

      if (msg.type === "user-count") {
        document.getElementById("player-count").textContent = "現在の参加人数: " + msg.count;
      }

      if (msg.type === "you-are-host" && isHost) {
        document.getElementById("start-button").style.display = "block";
      }

      if (msg.type === "start-quiz") {
        window.location.href = "/genre.html";
      }
    });

    document.getElementById("start-button").addEventListener("click", () => {
      socket.send(JSON.stringify({ type: "start-quiz", roomId }));
    });
  </script>
</body>
</html>
