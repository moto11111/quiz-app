<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>待機中</title>
</head>
<body>
  <h2>待機中</h2>
  <p id="playerCount">参加人数: 0人</p>
  <button id="startBtn" style="display: none;" onclick="startQuiz()">出題開始</button>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const roomId = sessionStorage.getItem("roomId");
    const isHost = sessionStorage.getItem("isHost") === "true";

    socket.emit("join_room", { roomId, isHost });

    socket.on("update_player_count", (count) => {
      document.getElementById("playerCount").textContent = `参加人数: ${count}人`;
    });

    socket.on("you_are_host", () => {
      document.getElementById("startBtn").style.display = "inline-block";
    });

    function startQuiz() {
      socket.emit("start_quiz", roomId);
    }

    socket.on("start_quiz", () => {
      location.href = "/genre";
    });
  </script>
</body>
</html>
