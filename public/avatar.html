<!DOCTYPE html>
<html lang="ja">
<head>

</head>

      <img src="images/ヒト8.png" class="avatar" alt="avatar4">

    <button id="confirmBtn">決定</button>
  </div>
  <script src="avatar.js"></script>
</body>
</html>
