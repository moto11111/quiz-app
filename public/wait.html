<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>待機画面</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h2>ルーム待機中</h2>
    <div id="playerCount">0/2</div>

    <div class="players">
      <div class="player" id="self">
        <img id="selfAvatar" src="" alt="自分のアバター" width="100" height="100" />
        <p>自分<br>ポイント：<span id="selfPoint">0</span></p>
      </div>

      <div class="player" id="opponent">
        <img id="opponentAvatar" src="" alt="相手のアバター" width="100" height="100" />
        <p>相手<br>ポイント：<span id="opponentPoint">0</span></p>
      </div>
    </div>

    <button id="startButton" style="display: none;">出題開始</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/wait.js"></script>
</body>
</html>
