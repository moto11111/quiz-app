<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>待機画面</title>
  <link rel="stylesheet" href="wait.css" />
</head>
<body>
  <div class="container">
    <h2>待機中のルーム</h2>
    <p id="roomIdText"></p>
    <p>現在の参加人数：<span id="userCount">1</span>/2</p>

    <button id="startButton" disabled style="display:none;">出題開始</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    const startButton = document.getElementById("startButton");
    let isHost = false;

    // ルームID表示
    document.getElementById("roomIdText").textContent = `ルームID: ${roomId}`;

    // ルームに参加
    socket.emit("join_room", { roomId });

    // ホスト判定を受け取ったとき
    socket.on("you_are_host", () => {
      isHost = true;
      startButton.style.display = "block";  // 表示
      startButton.disabled = true;          // 初期は無効
    });

    // 参加人数更新を受け取ったとき
    socket.on("update_player_count", (count) => {
      document.getElementById("userCount").textContent = count;
      if (isHost && count >= 2) {
        startButton.disabled = false;
      } else {
        startButton.disabled = true;
      }
    });

    // 出題開始通知を受け取ったら画面遷移
    socket.on("start_quiz", () => {
      window.location.href = `quiz.html?room=${roomId}`;
    });

    // 出題開始ボタンをクリックしたとき
    startButton.addEventListener("click", () => {
      socket.emit("start_quiz", roomId);
    });
  </script>
</body>
</html>
