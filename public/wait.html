<!-- wait.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>待機画面</title>
  <link rel="stylesheet" href="wait.css" />
</head>
<body>
  <div class="container">
    <h2>ルームに参加しました</h2>
    <p id="room-id-display">ルームID: </p>
    <p id="player-count">参加者: 0人</p>
    <button id="start-btn" style="display: none;">出題開始</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');
    const isHost = urlParams.get('host') === '1';

    // 表示
    document.getElementById('room-id-display').textContent = `ルームID: ${roomId}`;

    // 参加をサーバーに通知
    socket.emit("join_room", { roomId, isHost });

    // 人数更新を受信
    socket.on("update_player_count", (count) => {
      document.getElementById("player-count").textContent = `参加者: ${count}人`;
    });

    // ホストのみ開始ボタン表示
    socket.on("you_are_host", () => {
      document.getElementById("start-btn").style.display = "block";
    });

    // クイズ開始クリック
    document.getElementById("start-btn").addEventListener("click", () => {
      socket.emit("start_quiz", roomId);
    });

    // クイズ開始を受信したら遷移
    socket.on("start_quiz", () => {
      window.location.href = `/quiz.html?room=${roomId}`;
    });
  </script>
</body>
</html>
