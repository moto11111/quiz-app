<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>待機画面</title>
  <link rel="stylesheet" href="css/wait.css" />
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/wait.js" defer></script>
</head>
<body>
  <h2>ルーム待機中</h2>
  <div id="player-count">0/2</div>
  <div id="player-list" class="players"></div>
  <button id="start-button" style="display: none;">出題開始</button>
  
  <div class="player">
  <img id="player1Avatar" class="avatar" src="/images/avatar01.png" alt="自分のアバター">
  <p>自分<br>ポイント: <span id="player1Score">0</span></p>
</div>
<div class="player">
  <img id="player2Avatar" class="avatar" src="/images/avatar02.png" alt="相手のアバター">
  <p>相手<br>ポイント: <span id="player2Score">0</span></p>
</div>

</body>
</html>
