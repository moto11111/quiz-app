<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>待機画面</title>
  <link rel="stylesheet" href="wait.css" />
</head>
<body>
  <div class="container">
    <h2>待機中のルーム</h2>
    <p id="roomIdText"></p>
    <p>現在の参加人数：<span id="userCount">1</span>/2</p>

    <button id="startButton" disabled style="display:none;">出題開始</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room');

    document.getElementById("roomIdText").textContent = `ルームID: ${roomId}`;

    let isHost = false;

    socket.emit("join_room", { roomId });

    socket.on("you_are_host", () => {
      isHost = true;
      document.getElementById("startButton").style.display = "block";
    });

    socket.on("update_player_count", (count) => {
      document.getElementById("userCount").textContent = count;
      if (isHost && count >= 2) {
        document.getElementById("startButton").disabled = false;
      } else {
        document.getElementById("startButton").disabled = true;
      }
    });

    socket.on("start_quiz", () => {
      window.location.href = `quiz.html?room=${roomId}`;
    });

    document.getElementById("startButton").addEventListener("click", () => {
      socket.emit("start_quiz", roomId);

</body>
</html>
