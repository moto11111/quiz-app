<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>クイズ画面</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      padding: 40px;
    }
    #question {
      font-size: 24px;
      margin: 20px 0;
    }
    #question-number {
      font-weight: bold;
      margin-bottom: 10px;
    }
    #answer {
      font-size: 18px;
      padding: 8px;
      width: 300px;
    }
    #status {
      margin-top: 20px;
      font-size: 16px;
      color: #444;
    }
  </style>
</head>
<body>
  <div id="question-number">1/?</div>
  <div id="question">問題文が表示されます</div>
  <input type="text" id="answer" placeholder="回答を入力（Enterで送信）" disabled />
  <div id="status">状態が表示されます</div>
  <div id="player-list" style="display: flex; justify-content: center; gap: 20px; margin-top: 30px;"></div>


  <script src="/socket.io/socket.io.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
