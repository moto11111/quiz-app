<!-- genre.html -->
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const roomId = new URLSearchParams(window.location.search).get("room");

document.querySelectorAll(".genre-button").forEach(btn => {
  btn.addEventListener("click", () => {
    const selectedGenre = btn.dataset.genre;
    localStorage.setItem("selectedGenre", selectedGenre);
    sessionStorage.setItem("isHost", "true"); // ← ホストが選んだ印
    socket.emit("genre_selected", { roomId, genre: selectedGenre });
    location.href = `quiz.html?room=${roomId}`;
  });
});

// ゲストが受信した genre に基づいて quiz.html に進む
socket.on("genre_selected", (genre) => {
  localStorage.setItem("selectedGenre", genre);
  sessionStorage.setItem("isHost", "false");
  const roomId = new URLSearchParams(window.location.search).get("room");
  location.href = `quiz.html?room=${roomId}`;
});
</script>
