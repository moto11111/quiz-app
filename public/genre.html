<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ジャンル選択</title>
</head>
<body>
  <h2>ジャンルを選んでください</h2>
  <button onclick="selectGenre('anime')">アニメ</button>
  <button onclick="selectGenre('zatsu')">雑学</button>
  <button onclick="selectGenre('kihon')">基本</button>

  <script>
    function selectGenre(genre) {
      sessionStorage.setItem('genre', genre);
      window.location.href = '/quiz';
    }
  </script>
</body>
</html>
