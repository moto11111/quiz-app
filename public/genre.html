<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ジャンル選択</title>
  <link rel="stylesheet" href="css/genre.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <h2>ジャンルを選んでいます…</h2>
  <div id="genre-image-container">
    <img id="genre-image" src="" alt="ジャンル画像" width="300" />
  </div>

  <img id="genre-image" src="" alt="ジャンル画像" width="300">
  <h2 id="genre-text">ジャンル決定中...</h2>


  <script>
    const genres = [
      { name: "anime", image: "images/genre_anime.png" },
      { name: "kihon", image: "images/genre_kihon.png" },
      { name: "zatsu", image: "images/genre_zatsu.png" },
    ];

    const selected = genres[Math.floor(Math.random() * genres.length)];

    document.getElementById("genre-image").src = selected.image;

    const socket = io();
    const roomId = localStorage.getItem("roomId") || "defaultRoom";

    socket.emit("select_genre", { roomId, genre: selected.name });

    socket.on("start_quiz", () => {
      localStorage.setItem("genre", selected.name);
      window.location.href = "/quiz.html";
    });
  </script>
  <script src="js/genre.js" defer></script>

</body>
</html>
