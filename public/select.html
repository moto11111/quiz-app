<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>アバター選択</title>
  <link rel="stylesheet" href="select.css" />
</head>
<body>
  <div class="container">
    <h2>アバターと名前を選択</h2>
    <input type="text" id="playerName" placeholder="名前を入力" />
    <div class="avatars">
      <label><input type="radio" name="avatar" value="avatar1.png" checked /><img src="images/avatar1.png" /></label>
      <label><input type="radio" name="avatar" value="avatar2.png" /><img src="images/avatar2.png" /></label>
      <label><input type="radio" name="avatar" value="avatar3.png" /><img src="images/avatar3.png" /></label>
      <label><input type="radio" name="avatar" value="avatar4.png" /><img src="images/avatar4.png" /></label>
    </div>
    <button id="startBtn">ルームに進む</button>
  </div>

  <script src="js/select.js"></script>
</body>
</html>
