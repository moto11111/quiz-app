<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ルームに参加</title>
  <link rel="stylesheet" href="css/create.css" />
</head>
<body>
  <div class="container">
    <h2>ルームに参加</h2>
    <form id="joinForm">
      <label for="roomId">ルームID</label>
      <input type="text" id="roomId" placeholder="作成されたルームIDを入力" required />

      <label for="password">パスワード（形式のみ）</label>
      <input type="password" id="password" placeholder="必要ありません（形式のみ）" />

      <button type="submit">参加する</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/join.js"></script>
</body>
</html>
