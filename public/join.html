<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ルーム参加</title>
</head>
<body>
  <h2>ルームに参加</h2>
  <button onclick="joinRoom()">参加する</button>

  <script>
    function joinRoom() {
      const roomId = "room1"; // 仮固定ID
      sessionStorage.setItem("roomId", roomId);
      sessionStorage.setItem("isHost", "false");
      location.href = "/waiting";
    }
  </script>
</body>
</html>
