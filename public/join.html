<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ルーム参加</title>
  <link rel="stylesheet" href="join.css">
</head>
<body>
  <div class="container">
    <h2>ルームに参加</h2>
    <input type="text" id="roomIdInput" placeholder="参加するルームIDを入力">
    <button onclick="joinRoom()">参加して待機</button>
  </div>

  <script>
    function joinRoom() {
      const roomId = document.getElementById('roomIdInput').value.trim();
      if (roomId === '') {
        alert('ルームIDを入力してください');
        return;
      }
      sessionStorage.setItem('roomId', roomId);
      window.location.href = '/waiting';
    }
  </script>
</body>
</html>
